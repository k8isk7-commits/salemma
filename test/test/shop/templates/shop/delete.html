{% extends 'delivery/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-5 shadow">
            <div class="card-header text-center py-3">
                <h4 class="mb-0 font-weight-bold">⚠️ تأكيد عملية الحذف</h4>
            </div>
            <div class="card-body text-center p-4">
                <h5 class="mb-4">هل أنت متأكد من رغبتك في حذف هذه السلعة نهائياً؟</h5>
                <p class="text-danger bg-danger bg-opacity-10 p-3 rounded border border-danger border-opacity-20">{{ product.item_title }} - {{ product.unit_cost }} ر.س</p>
                <form method="POST" class="mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4 mx-2">تأكيد الحذف النهائي</button>
                    <a href="{% url 'index' %}" class="btn btn-secondary px-4 mx-2">إلغاء والتراجع</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
